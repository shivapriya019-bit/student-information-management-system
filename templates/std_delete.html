<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Delete Student</title>
    <link rel="stylesheet" href="{% static 'css/delete.css' %}">
</head>
<body>

    <h1>Delete Student</h1>

    <p>Are you sure you want to delete this student?</p>

    <table border="1">
        <tr>
            <th>Student ID</th>
            <td>{{ student.studentID }}</td>
        </tr>

        <tr>
            <th>Name</th>
            <td>{{ student.name }}</td>
        </tr>

        <tr>
            <th>Course</th>
            <td>{{ student.course }}</td>
        </tr>
    </table>

    <br>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">
            <img src="{% static 'css/image/delete.jpg' %}" alt="Delete student button to remove student records">
        
    </form>

    <br>

    <a href="{% url 'student_details' %}">
        <img src="{%static 'css/image/cancel.jpg'%}" alt="cancel">
    </a>

</body>
</html>
