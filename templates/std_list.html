<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>student names</title>
        <link rel="stylesheet" type="text/css" href="{% static 'css/std_list.css' %}">
    </head>
    {% load static %}


<body>

<h1>Student Names</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Student ID</th>
        <th>Name</th>
        <th>Details</th>
        <th>Update</th>
        <th>Delete</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.studentID }}</td>
        <td>{{ student.name }}</td>

        <td>
            <a href="{% url 'student_details' student.studentID %}">
                View Details
            </a>
        </td>

        <td>
            <a href="{% url 'student_update' student.studentID %}">
                <img src="{% static 'css/image/edit.jpg' %}"
                     alt="Small edit icon showing a pencil over paper indicating edit student record, neutral tone"
                     width="40">
            </a>
        </td>

        <td>
            <a href="{% url 'student_delete' student.studentID %}">
                <img src="{% static 'css/image/delete.jpg' %}"
                     alt="Small delete icon showing a red trash can representing remove student record, cautionary tone"
                     width="40">
            </a>
        </td>

    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No students found.</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="{% url 'home' %}">
   <img src="{% static 'css/image/home.jpg' %}" alt="Home">
</a>

</body>
</html>
